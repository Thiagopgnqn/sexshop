services:
  postgres:
    image: postgres:16-alpine
    container_name: nocturna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nocturna
      POSTGRES_PASSWORD: nocturna_local_dev
      POSTGRES_DB: nocturna_sexshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocturna -d nocturna_sexshop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
